site_name: python-unified-gateway
site_description: Local-first API orchestration, webhook ingestion, and replayable demonstration platform.
docs_dir: docs
site_dir: .site

# Local authoring history must not enter published documentation.
exclude_docs: |
  /000_genesis/
  **/.ipynb_checkpoints/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - toc.follow
    - content.code.copy

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: index.md
  - Orientation:
      - System at a Glance: 001_orientation/00_system-at-a-glance.md
      - Glossary: 001_orientation/10_glossary.md
      - Design Laws: 001_orientation/20_design-laws.md
      - Definition of Done: 001_orientation/30_definition-of-done.md
  - Architecture:
      - Data Flow: 002_architecture/20_data-flow.md
  - Events:
      - Event Contract: 003_events/00_event-contract.md
  - API:
      - HTTP API: 004_api/00_http-api.md
  - Runbooks:
      - Local Dev: 006_runbooks/10_local-dev.md
      - Hetzner API Ingress: 006_runbooks/11_hetzner_api_ingress.md
      - Connect HMAC Verification: 006_runbooks/12_connect_hmac.md
      - Architecture Explorer: 006_runbooks/13_architecture_explorer.md
      - Release Scope: 006_runbooks/14_release_scope.md
      - Workflow Builder API: 006_runbooks/15_workflow_api.md
  - Architecture Decisions:
      - ADR Index: 007_adr/index.md
      - ADR Template: 007_adr/0000_template.md
      - 007_adr/0001-external-event-service-authoritative-ingress.md
      - 007_adr/0002-gateway-owns-delivery-custody.md
      - 007_adr/0003-workflow-engines-not-systems-of-record.md
      - 007_adr/0004-raw-payloads-vs-normalized-facts.md
      - 007_adr/0005-replay-semantics-are-explicit-and-typed.md
      - 007_adr/0006-static-first-docs-live-data-via-gateway.md
      - 007_adr/0007-authoritative-decisions-require-live-systems.md
      - 007_adr/0008-pro-notebooks-are-authoring-only.md
      - 007_adr/0009-gateway-canonical-correlation-authority.md
      - 007_adr/0010-external-event-feed-authentication-and-integrity.md
      - 007_adr/0011-frontend-architecture-and-design-governance.md
      - 007_adr/0012-connect-webhook-verification-failures-rejected.md
  - Frontend Design:
      - Canon and Versions: frontend/index.md
      - Design Principles: frontend/design-principles.md
      - Product Specification: frontend/product-specification.md
      - Design System: frontend/design-system.md
      - Organization Profiles: frontend/organization-profile.md
      - Source Replicas: frontend/replica-specification.md
  - Demo:
      - Live Demo Checklist: 008_demo/10_live-demo-checklist.md
