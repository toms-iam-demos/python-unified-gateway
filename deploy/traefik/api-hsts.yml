http:
  middlewares:
    api-hsts:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: false
        stsPreload: false
        forceSTSHeader: false
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: no-referrer
        customResponseHeaders:
          Server: ''
          X-Powered-By: ''
          Cache-Control: no-store
          Permissions-Policy: camera=(), microphone=(), geolocation=()
