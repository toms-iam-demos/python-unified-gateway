[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pug-www"
version = "0.1.0"
description = "The Python Unified Gateway website and demonstration catalog"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.122,<1", "uvicorn>=0.38,<1", "jinja2>=3.1.6,<4", "bcrypt>=4.2,<6"]

[project.optional-dependencies]
test = ["httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pug_www = ["templates/*.html", "static/*.css", "static/*.js", "catalog.json"]
