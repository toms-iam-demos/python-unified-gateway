name: PUG website
on:
  push:
    paths: ['www/**', '.github/workflows/www.yml']
  pull_request:
    paths: ['www/**', '.github/workflows/www.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install --upgrade pip==26.2 setuptools==84.1.0
      - run: python -m pip install -r www/requirements.lock ./www
      - run: python -m unittest discover -s www/tests -v
