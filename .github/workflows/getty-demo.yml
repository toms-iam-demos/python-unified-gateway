name: Getty demo tests
on:
  push:
    paths: ['examples/getty-procurement-demo/**', '.github/workflows/getty-demo.yml']
  pull_request:
    paths: ['examples/getty-procurement-demo/**', '.github/workflows/getty-demo.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
        working-directory: examples/getty-procurement-demo
      - run: python -m pytest -q
        working-directory: examples/getty-procurement-demo
