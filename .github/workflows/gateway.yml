name: Gateway release checks
on:
  push:
    paths: ['gateway/**', 'tests/**', 'requirements*.txt', 'Dockerfile', 'deploy/**', '.github/workflows/gateway.yml']
  pull_request:
    paths: ['gateway/**', 'tests/**', 'requirements*.txt', 'Dockerfile', 'deploy/**', '.github/workflows/gateway.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip==26.2 setuptools==84.1.0
      - run: python -m pip install -r requirements-test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/test_workflow_session.mjs
      - run: python -m pytest tests -q
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit --local --progress-spinner off
      - run: python tools/check_public_identity.py
      - run: docker build -t pug-gateway-check .
