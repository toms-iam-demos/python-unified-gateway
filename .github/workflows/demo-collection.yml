name: Portable demo collection
on:
  push:
    paths: ['examples/**', '.github/workflows/demo-collection.yml']
  pull_request:
    paths: ['examples/**', '.github/workflows/demo-collection.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
        os: ['ubuntu-latest', 'windows-latest']
        demo: ['nfp-expense-demo', 'museum-procurement-demo', 'municipal-procurement-demo']
    defaults:
      run:
        working-directory: examples/${{ matrix.demo }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
