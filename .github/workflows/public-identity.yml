name: Public identity review
on: [push, pull_request]
permissions:
  contents: read
jobs:
  publication-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_public_identity.py -v
      - run: python tools/check_public_identity.py
